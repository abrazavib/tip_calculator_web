name: CI/CD Pipeline a Vercel

# El pipeline se ejecutará cuando hagas un push o un merge a la rama 'main'
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    # Inyectamos los secretos de Vercel como variables de entorno
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 1️⃣ Descargar el código
        uses: actions/checkout@v4

      - name: 2️⃣ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Usa la versión de Node de tu proyecto
          cache: "npm"

      - name: 3️⃣ Instalar dependencias
        run: npm ci

      - name: 4️⃣ Análisis de Código (Lint & TypeScript)
        run: |
          npm run lint
          npm run typecheck

      - name: 5️⃣ Ejecutar Pruebas (Vitest)
        run: npm run test:ci

      # --- A PARTIR DE AQUÍ SOLO LLEGA SI LAS PRUEBAS PASARON ---

      - name: 6️⃣ Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: 7️⃣ Traer configuración de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 8️⃣ Construir (Build) el Proyecto
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 9️⃣ Desplegar a Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
